name: Telegram digest

# Hourly ping so the daily summary lands close to the time you picked in
# Settings. The endpoint itself only sends one digest per day per owner.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST "$APP_URL/api/cron/notify" \
            -H "Authorization: Bearer $CRON_SECRET"
